<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidratación">
<meta name="theme-color" content="#0E2534">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Hidratación</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#081420;
    --bg-2:#0E2534;
    --surface:#0F2A3B;
    --surface-2:#123246;
    --border:rgba(255,255,255,.08);
    --accent:#5EEAD4;
    --accent-2:#22D3EE;
    --warm:#FDBA74;
    --text:#EAF3F2;
    --text-dim:#82A6B0;
    --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(34,211,238,.14), transparent 60%),
      radial-gradient(900px 500px at 85% 0%, rgba(94,234,212,.10), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%, #081119);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 18px 60px;
  }
  .wrap{max-width:440px;margin:0 auto;position:relative;z-index:1;}

  .light-glints{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  }
  .light-glints::before,
  .light-glints::after{
    content:"";position:absolute;width:65%;height:65%;border-radius:50%;
    filter:blur(30px);
  }
  .light-glints::before{
    top:-15%;left:-12%;
    background:radial-gradient(circle, rgba(94,234,212,.11), transparent 70%);
    animation:driftGlint 26s ease-in-out infinite alternate;
  }
  .light-glints::after{
    bottom:-22%;right:-16%;
    background:radial-gradient(circle, rgba(34,211,238,.09), transparent 70%);
    animation:driftGlint 33s ease-in-out infinite alternate;
    animation-delay:-9s;
  }
  @keyframes driftGlint{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(5%,4%) scale(1.1);}
    100%{transform:translate(-4%,-3%) scale(.94);}
  }

  header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);margin:0 0 6px;
  }
  h1.brand{
    font-family:'Fraunces', serif;
    font-weight:600;font-size:30px;margin:0;
    background:linear-gradient(135deg, var(--text), var(--accent) 140%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #refreshBtn{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .5s ease, color .2s ease, border-color .2s ease;
  }
  #refreshBtn:hover{color:var(--accent);border-color:rgba(94,234,212,.4);}
  #refreshBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #refreshBtn.spin{transform:rotate(360deg);}

  .hero-glass{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--border);
    border-radius:28px;
    padding:28px 20px 24px;
    display:flex;flex-direction:column;align-items:center;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .glass-stage{position:relative;width:150px;height:195px;margin-bottom:14px;filter:drop-shadow(0 12px 24px rgba(94,234,212,.15));}
  .glass{
    position:absolute;inset:0;
    width:150px;height:195px;
    clip-path:path('M30,15 L120,15 L108,180 Q108,187.5 101,187.5 L49,187.5 Q42,187.5 42,180 Z');
    background:rgba(255,255,255,.03);
  }
  .liquid{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(180deg, var(--accent-2), var(--accent) 85%);
    transition:height 1.3s cubic-bezier(.22,.9,.28,1.2);
  }
  .liquid::before{
    content:"";position:absolute;top:-8px;left:0;width:200%;height:16px;
    background:radial-gradient(ellipse 30px 8px at center, rgba(255,255,255,.55) 0%, transparent 70%) repeat-x;
    background-size:45px 16px;
    animation:waveScroll 2.6s linear infinite;
    opacity:.55;
  }
  @keyframes waveScroll{from{transform:translateX(0);}to{transform:translateX(-45px);}}
  .glass-outline-svg{position:absolute;inset:0;overflow:visible;}
  .glass-outline-svg path{
    fill:none;stroke:rgba(255,255,255,.25);stroke-width:2;
    vector-effect:non-scaling-stroke;
  }
  .glass-outline-svg line{stroke:rgba(255,255,255,.08);stroke-width:1;}

  .glass-shine{
    position:absolute;inset:0;pointer-events:none;
    clip-path:path('M30,15 L120,15 L108,180 Q108,187.5 101,187.5 L49,187.5 Q42,187.5 42,180 Z');
    background:linear-gradient(122deg,
      transparent 28%,
      rgba(255,255,255,.16) 40%,
      rgba(255,255,255,.32) 46%,
      rgba(255,255,255,.10) 53%,
      transparent 64%);
    mix-blend-mode:screen;
    animation:shineBreathe 5.5s ease-in-out infinite;
  }
  @keyframes shineBreathe{0%,100%{opacity:.65;}50%{opacity:1;}}

  .droplet{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(210,240,238,.25) 55%, rgba(210,240,238,.05) 75%);
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }

  .hero-readout{text-align:center;}
  .big-number{
    font-family:'Fraunces', serif;font-weight:700;
    font-size:52px;line-height:1;margin:0;letter-spacing:-.02em;
  }
  .big-number .unit{font-size:26px;color:var(--text-dim);font-weight:500;}
  .sub-label{margin:6px 0 2px;color:var(--text-dim);font-size:14px;}
  .remaining{
    margin:10px 0 0;font-size:14.5px;font-weight:500;
    color:var(--accent);
  }
  .remaining.done{color:var(--warm);}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:16px 8px;text-align:center;
  }
  .stat-icon{margin:0 0 4px;font-size:18px;}
  .flame-svg{
    display:block;margin:0 auto;transform-origin:50% 95%;
    animation:flameSway 2.6s ease-in-out infinite;
    filter:drop-shadow(0 0 5px rgba(253,186,116,.35));
  }
  .flame-inner{transform-origin:50% 95%;animation:flameGlow 2.1s ease-in-out infinite;}
  @keyframes flameSway{
    0%,100%{transform:scale(1) rotate(0deg);}
    22%{transform:scale(1.04,.96) rotate(-2deg);}
    48%{transform:scale(.96,1.05) rotate(1.5deg);}
    74%{transform:scale(1.02,.98) rotate(-1deg);}
  }
  @keyframes flameGlow{
    0%,100%{opacity:1;}
    50%{opacity:.72;}
  }
  .stat-value{
    font-family:'JetBrains Mono', monospace;font-weight:600;
    font-size:19px;margin:0;color:var(--text);
  }
  .stat-label{margin:2px 0 0;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:18px 18px 20px;margin-bottom:14px;
  }
  .panel h2{
    font-family:'Inter';font-size:13px;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin:0 0 16px;
  }

  .week-bars{display:flex;justify-content:space-between;align-items:flex-end;height:96px;gap:8px;}
  .week-col{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end;}
  .week-track{
    width:100%;max-width:26px;height:100%;border-radius:8px;background:rgba(255,255,255,.05);
    display:flex;align-items:flex-end;overflow:hidden;position:relative;
  }
  .week-fill{
    width:100%;border-radius:8px;
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
    transition:height 1s cubic-bezier(.22,.9,.28,1.1);
  }
  .week-fill.met{background:linear-gradient(180deg,#FDE68A,var(--warm));}
  .week-label{margin-top:8px;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .week-label.is-today{color:var(--accent);font-weight:600;}

  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{
    aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-dim);
    border:1px solid transparent;
  }
  .cell.l1{background:rgba(94,234,212,.18);}
  .cell.l2{background:rgba(94,234,212,.42);color:var(--bg-1);}
  .cell.l3{background:var(--accent);color:var(--bg-1);font-weight:600;}
  .cell.today{border-color:var(--accent);}

  footer{text-align:center;margin-top:22px;}
  .demo-banner{
    background:rgba(253,186,116,.12);border:1px solid rgba(253,186,116,.3);
    color:var(--warm);font-size:12.5px;padding:10px 14px;border-radius:12px;margin:0 0 12px;
  }
  .demo-banner code{background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px;}
  .footnote{color:var(--text-dim);font-size:12px;margin:0;}

  @keyframes cascadeIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .wrap > *{animation:cascadeIn .6s cubic-bezier(.22,.9,.28,1) both;}
  .wrap > *:nth-child(1){animation-delay:.02s;}
  .wrap > *:nth-child(2){animation-delay:.16s;}
  .wrap > *:nth-child(3){animation-delay:.30s;}
  .wrap > *:nth-child(4){animation-delay:.42s;}
  .wrap > *:nth-child(5){animation-delay:.52s;}
  .wrap > *:nth-child(6){animation-delay:.62s;}

  @media (prefers-reduced-motion: reduce){
    .liquid::before{animation:none;opacity:.35;}
    .liquid, .week-fill{transition:none;}
    #refreshBtn{transition:none;}
    .light-glints::before,.light-glints::after{animation:none;}
    .glass-shine{animation:none;opacity:.8;}
    .flame-svg,.flame-inner{animation:none;}
    .wrap > *{animation:none;opacity:1;transform:none;}
  }
</style>
</head>
<body>
  <div class="light-glints" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow" id="todayDate">HOY</p>
        <h1 class="brand">Hidratación</h1>
      </div>
      <button id="refreshBtn" aria-label="Actualizar datos" title="Actualizar">🔄</button>
    </header>

    <section class="hero-glass">
      <div class="glass-stage">
        <div class="glass"><div class="liquid" id="liquidFill"></div></div>
        <div class="glass-shine"></div>
        <div class="droplet" style="width:6px;height:8px;left:90px;top:52px;"></div>
        <div class="droplet" style="width:4px;height:5px;left:100px;top:78px;"></div>
        <div class="droplet" style="width:5px;height:6px;left:60px;top:100px;"></div>
        <div class="droplet" style="width:3.5px;height:4.5px;left:75px;top:130px;"></div>
        <svg class="glass-outline-svg" viewBox="0 0 150 195" width="150" height="195" aria-hidden="true">
          <path d="M30,15 L120,15 L108,180 Q108,187.5 101,187.5 L49,187.5 Q42,187.5 42,180 Z"/>
        </svg>
      </div>
      <p class="big-number"><span id="countNum">0</span><span class="unit">/<span id="goalNum">8</span></span></p>
      <p class="sub-label">vasos de agua hoy</p>
      <p class="remaining" id="remainingMsg">Cargando…</p>
    </section>

    <section class="stats-row">
      <div class="stat-card">
        <p class="stat-icon">
          <svg class="flame-svg" width="18" height="24" viewBox="0 0 24 32" aria-hidden="true">
            <defs>
              <linearGradient id="flameOuterGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#EA580C"/>
                <stop offset="55%" stop-color="#FDBA74"/>
                <stop offset="100%" stop-color="#FDE68A"/>
              </linearGradient>
              <linearGradient id="flameInnerGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#FDBA74"/>
                <stop offset="100%" stop-color="#FEF9E7"/>
              </linearGradient>
            </defs>
            <path fill="url(#flameOuterGrad)" d="M12 2C12 2 5.5 10.5 5.5 18C5.5 24 8.7 29 12 29C15.3 29 18.5 24 18.5 18C18.5 14.2 16.8 11.8 15.7 9.2C15.9 12 14.4 13 13.6 11.8C14.6 8 12 2 12 2Z"/>
            <path class="flame-inner" fill="url(#flameInnerGrad)" d="M12 13.5C12 13.5 9.7 17.2 9.7 20.4C9.7 22.8 10.7 24.6 12 24.6C13.3 24.6 14.3 22.8 14.3 20.4C14.3 18.6 13.4 17.1 12.9 15.7C12.9 17.1 12.1 17.4 11.8 16.8C12.4 15.2 12 13.5 12 13.5Z"/>
          </svg>
        </p>
        <p class="stat-value" id="streakNum">–</p>
        <p class="stat-label">Racha</p>
      </div>
      <div class="stat-card">
        <p class="stat-icon">🏆</p>
        <p class="stat-value" id="bestNum">–</p>
        <p class="stat-label">Mejor racha</p>
      </div>
      <div class="stat-card">
        <p class="stat-icon">🥤</p>
        <p class="stat-value" id="litersNum">–</p>
        <p class="stat-label">Litros hoy</p>
      </div>
    </section>

    <section class="panel">
      <h2>Últimos 7 días</h2>
      <div class="week-bars" id="weekBars"></div>
    </section>

    <section class="panel">
      <h2 id="monthLabel">Este mes</h2>
      <div class="heatmap" id="heatmap"></div>
    </section>

    <footer>
      <p class="demo-banner" id="demoBanner" hidden></p>
      <p class="footnote">Solo lectura · los vasos se registran con el sticker NFC</p>
    </footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="config.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cfg = window.AGUA_CONFIG || {};
  const GOAL = cfg.DAILY_GOAL_GLASSES || 8;
  const GLASS_ML = cfg.GLASS_ML || 250;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('goalNum').textContent = GOAL;
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('es-CL', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();

  const isConfigured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes('PEGA_AQUI') &&
                        cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes('PEGA_AQUI');

  function localDateKey(d){
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off*60000);
    return local.toISOString().slice(0,10);
  }

  function buildCounts(logs){
    const counts = {};
    logs.forEach(l => {
      const k = localDateKey(new Date(l.logged_at));
      counts[k] = (counts[k]||0) + 1;
    });
    return counts;
  }

  function computeStreaks(counts){
    const todayKey = localDateKey(new Date());
    let streak = 0;
    let cursor = new Date();
    if ((counts[todayKey]||0) >= GOAL){ streak = 1; }
    cursor.setDate(cursor.getDate()-1);
    while ((counts[localDateKey(cursor)]||0) >= GOAL){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }
    // mejor racha histórica
    const days = Object.keys(counts).sort();
    let best = 0, run = 0, prev = null;
    days.forEach(k => {
      if (counts[k] >= GOAL){
        if (prev){
          const diff = (new Date(k) - new Date(prev)) / 86400000;
          run = diff === 1 ? run + 1 : 1;
        } else { run = 1; }
        best = Math.max(best, run);
        prev = k;
      }
    });
    best = Math.max(best, streak);
    return { streak, best };
  }

  function animateNumber(el, to){
    if (reducedMotion){ el.textContent = to; return; }
    const startTime = performance.now(), dur = 800;
    function tick(now){
      const p = Math.min(1, (now-startTime)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(to*eased);
      if (p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function render(counts){
    const todayKey = localDateKey(new Date());
    const todayCount = counts[todayKey] || 0;
    const pct = Math.min(1, todayCount / GOAL);

    document.getElementById('liquidFill').style.height = (pct*100) + '%';
    animateNumber(document.getElementById('countNum'), todayCount);
    document.getElementById('litersNum').textContent = ((todayCount*GLASS_ML)/1000).toFixed(1) + 'L';

    const remainingEl = document.getElementById('remainingMsg');
    if (todayCount >= GOAL){
      const extra = todayCount - GOAL;
      remainingEl.textContent = extra > 0 ? `¡Meta cumplida! +${extra} de regalo 🎉` : '¡Meta cumplida! 🎉';
      remainingEl.classList.add('done');
    } else {
      const falta = GOAL - todayCount;
      remainingEl.textContent = `Te ${falta === 1 ? 'falta' : 'faltan'} ${falta} vaso${falta===1?'':'s'} para tu meta`;
      remainingEl.classList.remove('done');
    }

    const { streak, best } = computeStreaks(counts);
    document.getElementById('streakNum').textContent = streak;
    document.getElementById('bestNum').textContent = best;

    // últimos 7 días
    const dayLetters = ['D','L','M','M','J','V','S'];
    const weekWrap = document.getElementById('weekBars');
    weekWrap.innerHTML = '';
    for (let i=6;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      const key = localDateKey(d);
      const c = counts[key] || 0;
      const p = Math.min(1, c/GOAL);
      const isToday = key === todayKey;
      const col = document.createElement('div');
      col.className = 'week-col';
      col.innerHTML = `
        <div class="week-track">
          <div class="week-fill ${p>=1?'met':''}" style="height:${reducedMotion? (p*100)+'%':'0%'}" data-final="${p*100}"></div>
        </div>
        <span class="week-label ${isToday?'is-today':''}">${dayLetters[d.getDay()]}</span>`;
      weekWrap.appendChild(col);
    }
    if (!reducedMotion){
      requestAnimationFrame(() => {
        weekWrap.querySelectorAll('.week-fill').forEach(el => {
          el.style.height = el.dataset.final + '%';
        });
      });
    }

    // heatmap del mes actual
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const monthNames = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    document.getElementById('monthLabel').textContent = monthNames[month].charAt(0).toUpperCase()+monthNames[month].slice(1);
    const heatmap = document.getElementById('heatmap');
    heatmap.innerHTML = '';
    for (let day=1; day<=daysInMonth; day++){
      const d = new Date(year, month, day);
      const key = localDateKey(d);
      const c = counts[key] || 0;
      const p = c/GOAL;
      let level = 'l0';
      if (c>0 && p<0.5) level='l1'; else if (p<1) level='l2'; else if (p>=1) level='l3';
      const cell = document.createElement('div');
      cell.className = `cell ${level} ${key===todayKey?'today':''}`;
      cell.title = `${day} ${monthNames[month]}: ${c} vaso${c===1?'':'s'}`;
      cell.textContent = day;
      heatmap.appendChild(cell);
    }
  }

  async function loadData(){
    if (!isConfigured){
      showDemoBanner('Modo demostración — conecta tu Supabase en config.js');
      render(buildCounts(mockLogs()));
      return;
    }
    try{
      const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      const { data, error } = await client
        .from('water_logs')
        .select('logged_at')
        .order('logged_at', { ascending:true });
      if (error) throw error;
      render(buildCounts(data || []));
    } catch(err){
      showDemoBanner('No se pudo conectar a Supabase — revisa config.js');
      render(buildCounts(mockLogs()));
    }
  }

  function showDemoBanner(msg){
    const b = document.getElementById('demoBanner');
    b.textContent = msg;
    b.hidden = false;
  }

  function mockLogs(){
    // datos de ejemplo solo para previsualizar el diseño
    const logs = [];
    const pattern = [3,8,9,6,8,10,4,8,8,7,9,5];
    for (let i=pattern.length-1;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      for (let g=0; g<pattern[pattern.length-1-i]; g++){
        const t = new Date(d);
        t.setHours(8+g, 0, 0, 0);
        logs.push({ logged_at: t.toISOString() });
      }
    }
    return logs;
  }

  document.getElementById('refreshBtn').addEventListener('click', (e) => {
    e.currentTarget.classList.add('spin');
    loadData().finally(() => setTimeout(()=>e.currentTarget.classList.remove('spin'), 500));
  });

  loadData();
  setInterval(loadData, 45000);
});
</script>
</body>
</html>
